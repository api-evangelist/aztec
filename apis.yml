aid: aztec
name: Aztec
description: >-
  Aztec is the leading privacy-first Layer 2 zkRollup on Ethereum, enabling developers to
  build private smart contracts with fully programmable end-to-end privacy. Developers write
  contracts in Noir using the Aztec.nr framework, interact with the network through the
  Aztec.js TypeScript SDK and the Private eXecution Environment (PXE), and use the first-party
  `aztec` CLI to compile, test, prove, and deploy. Aztec ships an official MCP server and
  recommended CLAUDE.md/AGENTS.md instructions for AI-assisted development. Backed by a16z,
  Paradigm, and SV Angel.
